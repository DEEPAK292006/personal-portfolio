<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D3A66B" />
      <stop offset="50%" stop-color="#C18B4A" />
      <stop offset="100%" stop-color="#8E6533" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="#0A0A0A" stroke="#C18B4A" stroke-width="1.5" stroke-opacity="0.3" />
  
  <!-- Interlocking DM Monogram -->
  <g filter="url(#glow)">
    <!-- Letter D Outer Spine & Arc -->
    <path d="M 24 24 L 24 76 M 24 24 L 42 24 C 54 24 60 34 60 50 C 60 66 54 76 42 76 L 24 76" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <!-- Letter M Dynamic Accent Interlock -->
    <path d="M 44 76 L 44 42 L 58 58 L 72 42 L 72 76" 
          fill="none" 
          stroke="#F5F2ED" 
          stroke-width="4" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          stroke-opacity="0.95" />
          
    <!-- Subtle Golden Pin Accent -->
    <circle cx="58" cy="58" r="2.5" fill="#D3A66B" />
  </g>
</svg>
